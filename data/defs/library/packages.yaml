---
core: &core
  include:
    - "@core"
    - "systemd-pam"
    - "systemd-networkd"
    - "systemd-networkd-defaults"
    - "dbus"
    - "fwupd-efi"
    - "libxkbcommon"
    - "linux-firmware"
    - "teamsbc-selinux"
  exclude:
    - "NetworkManager"
    - "sssd*"
    - "dracut-config-rescue"
    - "firewalld"
    - "plymouth"
    - "kmscon"
    - "sudo"

lhotse: &lhotse
  include:
    - "teamsbc-release-lhotse"
    - "teamsbc-config-lhotse"

makalu: &makalu
  include:
    - "teamsbc-release-makalu"
    - "teamsbc-config-makalu"
    # TODO, do we really want this here? We should probably go full sysupdate
    # TODO, or such and not have any "build" dependencies here.
    - "systemd-ukify"
    # TODO, we need `objcopy` since in a UKI layout dracut wants to use it; but
    # TODO, it doesn't depend on it?
    - "binutils"

wifi: &wifi
  include:
    - "wpa_supplicant"
