---
core: &core
  include:
    - "@core"
    - "systemd-pam"
    - "systemd-networkd"
    - "systemd-networkd-defaults"
    - "dbus"
    - "fwupd-efi"
    - "libxkbcommon"
    - "linux-firmware"
    - "teamsbc-selinux"
  exclude:
    - "NetworkManager"
    - "sssd*"
    - "dracut-config-rescue"
    - "firewalld"
    - "plymouth"
    - "kmscon"
    - "sudo"

lhotse: &lhotse
  include:
    - "teamsbc-release-lhotse"
    - "teamsbc-config-lhotse"

makalu: &makalu
  include:
    - "teamsbc-release-makalu"
    - "teamsbc-config-makalu"
    # TODO, do we really want this here? We should probably go full sysupdate
    # TODO, or such and not have any "build" dependencies here.
    - "systemd-ukify"
    # TODO, sd-pull is shipped in systemd-container
    - "systemd-container"
    # TODO, systemd-container doesn't require gnupg2 but sd-pull tries to execute
    # TODO, gpg/gpg2 directly
    - "gnupg2"
    # TODO, we need `objcopy` since in a UKI layout dracut wants to use it; but
    # TODO, it doesn't depend on it?
    - "binutils"
  exclude:
    # TODO, look into the dependency chain that pulls these in
    - "dnf5"
    - "dnf5-plugins"
    - "rpm"

wifi: &wifi
  include:
    - "wpa_supplicant"
