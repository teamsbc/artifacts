---
esp: &esp
  size: "1 GiB"
  type: !xref "library/dps.yaml#esp"
  payload_type: "filesystem"
  payload:
    type: vfat
    mountpoint: "/boot"
    label: "ESP"

usr: &usr
  size: "2 GiB"
  payload_type: "filesystem"
  payload:
    type: "ext4"
    label: "usr"
    mountpoint: "/usr"

usr-empty: &usr-empty
  size: "2 GiB"
  label: "_empty"
  attrs:
    - 63  # no-auto: reserve this slot for sysupdate without mounting it

root: &root
  size: "6 GiB"
  attrs:
    - 59  # grow filesystem gpt flag, setting this allows tooling that
          # understands this flag (systemd) to automatically grow the filesystem
          # when the partition is mounted
  payload_type: "filesystem"
  payload:
    type: "ext4"
    label: "root"
    mountpoint: "/"
