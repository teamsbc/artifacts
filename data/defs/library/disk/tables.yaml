---
shared: &shared
  grain_size: 4096
  start_offset: "1 MiB"
  absolute_start_offset: true

virt: &virt
  x86_64:
    <<: *shared
    type: "gpt"
    partitions:
      - !xref "library/disk/partitions.yaml#esp"
      - <<: !xref "library/disk/partitions.yaml#root"
        size: "2 GiB"
        type: !xref "library/dps.yaml#root_x86_64"

  aarch64:
    <<: *shared
    type: "gpt"
    partitions:
      - !xref "library/disk/partitions.yaml#esp"
      - <<: !xref "library/disk/partitions.yaml#root"
        type: !xref "library/dps.yaml#root_aarch64"

rpi: &rpi
  aarch64:
    <<: *shared
    type: "gpt"
    partitions:
      - <<: !xref "library/disk/partitions.yaml#esp"
      - <<: !xref "library/disk/partitions.yaml#root"
        type: !xref "library/dps.yaml#root_aarch64"
